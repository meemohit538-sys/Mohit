<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Colour Prediction Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Colour Prediction Game</h1>

    <div class="balance">
      Balance: ₹<span id="balance">100</span>
    </div>

    <div class="buttons">
      <button onclick="play('Red')" class="red">Red</button>
      <button onclick="play('Green')" class="green">Green</button>
      <button onclick="play('Blue')" class="blue">Blue</button>
    </div>

    <h2 id="result">Choose a colour</h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
